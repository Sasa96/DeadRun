kind = "mobile"
previewPath = "/"
title = "Dead Run"
description = "A 3D zombie-survival runner for iPhone with a survivor fleeing the infected, calibrated tilt steering, swipe jumping and sliding, supply collection, and saved high scores."
version = "1.0.0"
id = "artifacts/relic-rush"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22536

[services.development]
run = "pnpm --filter @workspace/relic-rush run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/relic-rush", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/relic-rush", "run", "serve" ]

[services.env]
PORT = "22536"
BASE_PATH = "/"
